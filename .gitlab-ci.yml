# Real pipeline. (The Auto-DevOps template that previously lived here ran
# none of the project's own gates — see docs/adr/, "CI is a mirage".)
# Mirrors .github/workflows/ci.yml; both are thin wrappers over scripts/ so
# the same steps run identically on a laptop.
stages: [check, test, package]

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

default:
  image: golang:1.26

checks:
  stage: check
  script:
    - go install github.com/bufbuild/buf/cmd/buf@v1.72.0
    - go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
    # buf.gen.yaml resolves these from PATH; without them nothing regenerates.
    - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
    - go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - buf lint
    - for s in scripts/check/*.sh; do echo "== $s"; bash "$s"; done

build-unit:
  stage: test
  script:
    - go vet ./...
    - go build ./...
    - go test -race -shuffle=on ./...
    - cd pkg/anubis && go vet ./... && go test -race -shuffle=on ./...

backend-suite:
  stage: test
  services:
    - name: postgres:18
      alias: postgres
    # The engine Anubis syncs FROM, which is deliberately not the one it stores
    # in: the e2e sync test seeds it and reads the hierarchy back through the
    # API. Drop it and that test skips without saying so.
    - name: mysql:8
      alias: mysql
  variables:
    POSTGRES_USER: anubis
    POSTGRES_PASSWORD: anubis
    POSTGRES_DB: anubis_ci
    MYSQL_ROOT_PASSWORD: anubis
    MYSQL_DATABASE: anubis_src
    ANUBIS_DB_URL: postgres://anubis:anubis@postgres:5432/anubis_ci?sslmode=disable
    ANUBIS_TEST_MYSQL_DSN: mysql://root:anubis@mysql:3306/anubis_src
    ANUBIS_LOAD_WORKERS: "8"
    ANUBIS_LOAD_BUDGET_MS: "400"
  script:
    - bash scripts/ci/backend-suite.sh

console:
  stage: test
  image: oven/bun:1.4.0
  script:
    - cd ui && bun install --frozen-lockfile && bun run build

image:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker build --build-arg VERSION=${CI_COMMIT_SHORT_SHA} -t anubisd:${CI_COMMIT_SHORT_SHA} .
