# One generated package per bounded context (ADR-0009): each context's
# adapter owns its own queries, so no package holds another context's SQL.
version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "db/queries/platform"
    gen:
      go:
        package: "gen"
        out: "internal/platform/database/gen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_pointers_for_null_types: true
  - engine: "postgresql"
    schema: "migrations"
    queries: "db/queries/identity"
    gen:
      go:
        package: "gen"
        out: "internal/identity/adapter/postgres/gen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
