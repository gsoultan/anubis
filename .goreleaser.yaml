# Release: Linux binaries and packages. No Kubernetes — this ships a binary
# a Linux host runs under systemd.
version: 2

project_name: anubisd

before:
  hooks:
    # ORDER MATTERS. The binary embeds ui/dist (ui/embed.go), and the copy
    # committed to git is a PLACEHOLDER that says "console not built". If the
    # console is not built first, the release ships that page instead of the
    # console — silently, because the build succeeds either way.
    # Builds the console AND fails the release if the placeholder survived.
    - ./scripts/build-console.sh
    - go mod download

builds:
  - id: anubisd
    main: ./cmd/anubisd
    binary: anubisd
    env:
      # Static binary: the runtime image and the .deb both assume no libc
      # dependency beyond what a bare host has.
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      # main.version exists for exactly this (it was passed for months with
      # no variable to land in).
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: anubisd
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - src: docs/*.md
        dst: docs
      - src: packaging/anubisd.service
        dst: packaging/anubisd.service
      - src: packaging/anubisd.env.example
        dst: packaging/anubisd.env.example

nfpms:
  - id: anubisd
    package_name: anubisd
    vendor: Anubis
    homepage: https://github.com/gsoultan/anubis
    maintainer: gsoultan <gembit.soultan@gmail.com>
    description: |
      Anubis — multi-tenant identity and authorization service.
      Ships the admin console inside the binary; needs only PostgreSQL.
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: packaging/anubisd.service
        dst: /lib/systemd/system/anubisd.service
        type: config
      - src: packaging/anubisd.env.example
        dst: /etc/anubis/anubisd.env
        type: config|noreplace
      - dst: /etc/anubis
        type: dir
        file_info:
          mode: 0750
      # Where the master key credential lives when systemd is not managing it.
      - dst: /etc/anubis/secrets
        type: dir
        file_info:
          mode: 0700
    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh

checksum:
  name_template: "checksums.txt"

# A checksum file proves integrity only to somebody who already trusts where
# they got it from. Anyone able to replace the artefact can replace the
# checksum beside it. Signing the checksum file breaks that: verify the
# signature once and every artefact it lists is covered.
#
# Keyless (Sigstore): the signing identity is the GitHub workflow itself,
# recorded in a public transparency log. No private key to store, rotate or
# leak — which matters for a project whose whole subject is key handling.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# What is actually inside the binary, in a format a scanner can read. An
# operator asking "am I exposed to CVE-X" should not have to guess from a
# go.mod.
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.json"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # The commit messages in this project carry the reasoning; a generated
  # list of them is the changelog.
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
  prerelease: auto
  header: |
    ## anubisd {{ .Version }}

    Linux amd64/arm64. The admin console is inside the binary — no separate
    asset to deploy, and it is served same-origin on the API port.

    **Upgrading:** run `anubisd migrate` before starting the new version.
    Migrations are forward-only and take an advisory lock, so several hosts
    starting at once cannot race.

    **Read this before upgrading past 0.2.0.** Migration 0037 revokes
    `USAGE ON SCHEMA public` from `PUBLIC`. Until it, every role in the
    database reached the schema whether or not anything had granted it —
    which made the least-privilege grants decorative. `anubis_app` and
    `anubis_readonly` hold USAGE explicitly and are unaffected.

    Any OTHER role you added — a reporting user, a BI connector, an
    integration — will stop working and report
    `relation "…" does not exist`, which is Postgres describing a schema it
    may not use. Fix it deliberately:

    ```sql
    GRANT USAGE ON SCHEMA public TO your_role;
    ```

    Check for affected roles before you upgrade:

    ```sql
    SELECT rolname FROM pg_roles
    WHERE rolcanlogin
      AND rolname NOT IN ('anubis_app','anubis_readonly','anubis_owner')
      AND NOT rolsuper;
    ```
