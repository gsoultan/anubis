# The pipeline IS the enforcement: every invariant scripts/check/* pins is
# only real when something runs it on every push. Jobs are thin wrappers over
# scripts/ so the same steps run identically on a laptop.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUF_VERSION: "1.72.0"
  SQLC_VERSION: "1.31.1"
  # Pinned, not floating: the console is compiled INTO the release binary,
  # so the bundler version is part of what ships.
  BUN_VERSION: "1.4.0"

jobs:
  checks:
    name: enforcement gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install buf + sqlc + protoc plugins (pinned)
        # buf.gen.yaml resolves protoc-gen-go and protoc-gen-connect-go from
        # PATH (`local:`), so the drift check cannot regenerate anything
        # without them. Versions track go.mod so CI reproduces the committed
        # bytes rather than rewriting them.
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v${BUF_VERSION}
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v${SQLC_VERSION}
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
      - name: buf lint
        run: buf lint
      - name: enforcement gates
        run: |
          for s in scripts/check/*.sh; do
            echo "== $s"
            bash "$s"
          done

  build-unit:
    name: build + unit (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -shuffle=on ./...
      - name: verifier SDK (nested module)
        run: cd pkg/anubis && go vet ./... && go test -race -shuffle=on ./...

  backend-suite:
    name: integration + e2e + fuzz smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: anubis
          POSTGRES_PASSWORD: anubis
          POSTGRES_DB: anubis_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anubis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANUBIS_DB_URL: postgres://anubis:anubis@localhost:5432/anubis_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/ci/backend-suite.sh
        env:
          # A shared runner is ~10x slower than a development machine (1,100
          # vs 11,800 decisions/s measured). The latency assertion is kept —
          # at a ceiling that catches an order-of-magnitude regression rather
          # than runner noise. The correctness assertions in that test do not
          # move: zero errors and zero deny-flips, whatever the hardware.
          ANUBIS_LOAD_WORKERS: "8"
          ANUBIS_LOAD_BUDGET_MS: "400"

  console:
    name: console typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: ui
      - run: bun run build
        working-directory: ui

  release-build:
    name: release build (snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The release generates SBOMs, so the snapshot must too — otherwise
      # this job stops proving what a tag will actually do.
      - uses: anchore/sbom-action/download-syft@v0
      # Proves the packaging works BEFORE a tag depends on it — including
      # that the console really got embedded rather than the placeholder.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # Signing is skipped here and only here: keyless signing needs the
          # OIDC identity of the release workflow, which a snapshot does not
          # have. Everything else a tag does, this does.
          args: release --snapshot --clean --skip=publish,sign
      - name: the binary must carry the real console
        run: |
          bin=$(find dist -name anubisd -path '*linux_amd64*' | head -1)
          if strings "$bin" | grep -q "Console not built"; then
            echo "FATAL: release binary embeds the placeholder console"; exit 1
          fi
          strings "$bin" | grep -q "Anubis Console" || { echo "FATAL: no console in binary"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          retention-days: 7

  image:
    name: container image
    runs-on: ubuntu-latest
    needs: [checks, build-unit, backend-suite, console, release-build]
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build --build-arg VERSION=${GITHUB_SHA::12} -t anubisd:${GITHUB_SHA::12} .
      # Publishing waits on a registry decision (GHCR vs private); the build
      # itself still proves the Dockerfile every run.
