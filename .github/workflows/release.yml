# Tag a version, get Linux binaries and packages. The console is built by
# GoReleaser's before-hook (scripts/build-console.sh), which FAILS the
# release if the placeholder survived — a release that quietly ships
# "console not built" is worse than no release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Keyless signing exchanges this token for a short-lived Sigstore
  # certificate; there is no private key anywhere in this repository.
  id-token: write

env:
  # Must match ci.yml: a tag builds the same console CI proved.
  BUN_VERSION: "1.4.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the changelog from history; a shallow clone
          # produces an empty one.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: refuse a lightweight tag
        # The release notes lead with the annotated tag's message
        # (.goreleaser.yaml, release.header: {{ .TagBody }}). A lightweight tag
        # has no message, and goreleaser then falls back to the tagged commit's
        # body without saying so — on a merge commit, a PR title standing in
        # for the release notes. Refusing here is cheaper than noticing later.
        run: |
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag. Tag with 'git tag -a' so the release notes carry its message." >&2
            exit 1
          fi
      - name: install buf + protoc plugins (pinned)
        # The gates regenerate code to check for drift, so they need the
        # same toolchain CI uses — pinned to the versions that produced the
        # committed bytes. No sqlc: nothing has run it since 2026-09-18, and
        # an unused tool compiled inside the job that holds id-token: write is
        # attack surface with no benefit.
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
      - name: gate the release on the suite that guards it
        # A tag must not produce artefacts the pipeline would have rejected.
        run: |
          for s in scripts/check/*.sh; do echo "== $s"; bash "$s"; done
          go test ./...
          cd pkg/anubis && go test ./...
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
